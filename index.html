<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Cadastro de Caminhão</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <form id="caminhaoForm" class="form">
    <h2>Cadastrar Caminhão</h2>

    <label for="placa">Placa:</label>
    <input
      type="text"
      id="placa"
      name="placa"
      placeholder="AAA-1234"
      pattern="[A-Z]{3}-[0-9]{4}"
      title="Formato: AAA-1234"
      required
    />

    <label for="status">Status:</label>
    <select id="status" name="status" required>
      <option value="" disabled selected>Selecione o status</option>
      <option value="ATIVO">Disponível</option>
      <option value="INATIVO">Indisponível</option>
      <option value="EM_MANUTENCAO">Manutenção</option>
    </select>

    <label for="capacidadeKg">Capacidade (kg):</label>
    <input type="number" id="capacidadeKg" name="capacidadeKg" min="1" required />

    <label for="latitude">Latitude:</label>
    <input type="number" id="latitude" name="latitude" step="any" min="-90" max="90" required />

    <label for="longitude">Longitude:</label>
    <input
      type="number"
      id="longitude"
      name="longitude"
      step="any"
      min="-180"
      max="180"
      required
    />

    <button type="submit">Cadastrar</button>

    <p id="mensagem"></p>
  </form>

  <script src="script.js"></script>
</body>
</html>
